spring:
  application:
    name: talentmatch-backend
  datasource:
    # Lokale Entwicklung: dateibasierte H2-Datenbank im PostgreSQL-Modus (Daten bleiben erhalten)
    url: jdbc:h2:file:./data/talentmatch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 120MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.2

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

talentmatch:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    # Nur für die lokale Entwicklung – in Produktion per TALENTMATCH_JWT_SECRET überschreiben (Base64, >= 256 Bit)
    secret: ${TALENTMATCH_JWT_SECRET:dGFsZW50bWF0Y2gtbG9jYWwtZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbiE=}
    expiration: 8h
  upload:
    max-file-size-bytes: 10485760
  mail:
    # Ohne spring.mail.host (SMTP) werden E-Mails nur im Postausgang der App abgelegt, nicht versendet.
    from: ${TALENTMATCH_MAIL_FROM:noreply@talentmatch.local}
    # Basis-URL für Links in E-Mails (Antwortseite der Evidenz-Anfrage)
    app-base-url: ${TALENTMATCH_APP_BASE_URL:http://localhost:4200}
  talent-pool:
    response-period: 14d
    reminder-after: 7d
    retention: 730d
  seed:
    # Demo-Daten (Stellen, Bewerbungen, KI-Analysen) und Demo-Benutzer beim ersten Start anlegen.
    enabled: true
    # Test-Zugangsdaten für die lokale Demo (in Produktion per Umgebungsvariable setzen bzw. seed.enabled=false)
    hr-email: katrin.vogel@talentmatch.de
    hr-password: ${TALENTMATCH_SEED_HR_PASSWORD:TalentMatch2026!}
    applicant-email: bewerber@talentmatch.de
    applicant-password: ${TALENTMATCH_SEED_APPLICANT_PASSWORD:Bewerber2026!}
