# Prüfungen aus CLAUDE.md bei jedem Push und Pull Request
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Tests + Checkstyle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests
        run: ./mvnw -B clean test
      - name: Checkstyle
        run: ./mvnw -B checkstyle:check

  frontend:
    name: Frontend (Build, Tests, Lint, Format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Lockdatei stammt von npm 11 (packageManager in package.json); npm 10 aus Node 22 lehnt sie ab
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test -- --watch=false
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
